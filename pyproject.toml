[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "irish-demand-forecast"
version = "0.1.0"
description = "Day-ahead Irish electricity demand forecasting with regime clustering and walk-forward validation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
app = ["streamlit>=1.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
