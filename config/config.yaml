data:
  start_date: "2014-01-01"      # check actual dashboard coverage per variable
  end_date: null                # null = latest available
  resolution: "1h"              # resample target; raw 15-min kept on disk
  region: "ROI"                 # ROI or all-island: stay consistent with weather

validation:
  initial_train_days: 1095      # ~3 years before first test fold
  test_days: 365
  step_days: 365
  gap_days: 0
  final_holdout_days: 365       # untouched until the very end

training:
  window: "expanding"          # expanding | rolling
  rolling_years: 5
  recency_weighting: false
  covid_handling: "flag"       # flag | exclude | none

features:
  lags: true
  weather: true
  calendar: true
  events: false
  regimes: false

models:
  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 31
  regimes:
    n_clusters: 6
    min_cluster_days: 30
